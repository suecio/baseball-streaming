<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBSC Europe TV | Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HLS.js for Video Playback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>

    <style>
        /* Custom modal animation */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-blue-500 selection:text-white">

    <div class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Navigation -->
        <nav class="flex flex-col md:flex-row justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-8 shadow-xl">
            <div class="flex items-center gap-3 mb-4 md:mb-0">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-500/50">B</div>
                <h1 class="text-2xl font-black tracking-tight text-white">WBSC Europe TV</h1>
            </div>
            <div class="flex gap-2 bg-slate-950 p-1 rounded-xl">
                <button id="tab-live" onclick="switchTab('live')" class="px-5 py-2 rounded-lg font-bold transition-all bg-blue-600 text-white shadow">Live Now</button>
                <button id="tab-archive" onclick="switchTab('archive')" class="px-5 py-2 rounded-lg font-bold transition-all text-slate-400 hover:text-white">Archive</button>
                <button id="tab-admin" onclick="switchTab('admin')" class="px-5 py-2 rounded-lg font-bold transition-all text-slate-400 hover:text-white">Admin</button>
            </div>
        </nav>

        <!-- LIVE VIEW -->
        <div id="view-live" class="fade-in block">
            <div id="live-content">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- ARCHIVE VIEW -->
        <div id="view-archive" class="fade-in hidden">
            <h2 class="text-3xl font-black mb-8 border-b border-slate-800 pb-4">Match Archive</h2>
            <div id="archive-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- ADMIN VIEW -->
        <div id="view-admin" class="fade-in hidden grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Add Match Form -->
            <div class="lg:col-span-1 bg-slate-900 p-6 rounded-2xl border border-slate-800 h-fit shadow-xl">
                <h2 class="text-xl font-black mb-6 border-b border-slate-800 pb-4">Add Match Data</h2>
                <form id="admin-form" onsubmit="handleSaveMatch(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Match Title</label>
                        <input id="form-title" required type="text" placeholder="e.g. BECC Final" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Home Team</label>
                            <input id="form-home" required type="text" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Away Team</label>
                            <input id="form-away" required type="text" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Date</label>
                            <input id="form-date" required type="date" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white [color-scheme:dark] focus:border-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Status</label>
                            <select id="form-status" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 focus:outline-none">
                                <option value="live">Live Now</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Stream / Video URL</label>
                        <input id="form-url" required type="text" placeholder="https://stream.deportes.se/..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-sm focus:border-blue-500 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-emerald-900/20 mt-2">Save to Database</button>
                </form>
            </div>
            
            <!-- Database List -->
            <div class="lg:col-span-2">
                <h3 class="text-xl font-black mb-6">Database Management</h3>
                <div id="admin-list" class="space-y-3">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>

    </div>

    <!-- Application Logic (Vanilla JS) -->
    <script>
        // --- State Management ---
        let matches = [];
        let currentHls = null;

        // Initialize Database
        function initApp() {
            const saved = localStorage.getItem('wbsc_vanilla_db');
            if (saved) {
                matches = JSON.parse(saved);
            } else {
                const defaultMatch = {
                    id: Date.now().toString(),
                    title: "European Cup Baseball",
                    teamHome: "Home Team",
                    teamAway: "Away Team",
                    date: new Date().toISOString().split('T')[0],
                    status: "live",
                    url: "https://deportes.se/live_stream/index.m3u8"
                };
                matches = [defaultMatch];
                saveDb();
            }
            
            // Set default date in form
            document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
            
            // Initial Render
            renderLive();
            renderArchive();
            renderAdmin();
        }

        function saveDb() {
            localStorage.setItem('wbsc_vanilla_db', JSON.stringify(matches));
        }

        // --- UI Navigation ---
        function switchTab(tabName) {
            // Update buttons
            ['live', 'archive', 'admin'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                if (tab === tabName) {
                    btn.className = "px-5 py-2 rounded-lg font-bold transition-all bg-blue-600 text-white shadow";
                    if(tab === 'admin') btn.className = "px-5 py-2 rounded-lg font-bold transition-all bg-emerald-600 text-white shadow";
                } else {
                    btn.className = "px-5 py-2 rounded-lg font-bold transition-all text-slate-400 hover:text-white";
                }
            });

            // Update Views
            document.getElementById('view-live').style.display = tabName === 'live' ? 'block' : 'none';
            document.getElementById('view-archive').style.display = tabName === 'archive' ? 'block' : 'none';
            document.getElementById('view-admin').style.display = tabName === 'admin' ? 'grid' : 'none';

            // Re-render live if switching back to it
            if (tabName === 'live') renderLive();
        }

        // --- Video Player Logic ---
        function initPlayer(videoElementId, src) {
            const video = document.getElementById(videoElementId);
            if (!video) return;

            if (currentHls) {
                currentHls.destroy();
            }

            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari support
                video.src = src;
                video.play().catch(e => console.log("Autoplay blocked"));
            } else if (window.Hls && window.Hls.isSupported()) {
                // HLS.js fallback for Chrome/Firefox
                currentHls = new window.Hls({ capLevelToPlayerSize: true });
                currentHls.loadSource(src);
                currentHls.attachMedia(video);
                currentHls.on(window.Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Autoplay blocked"));
                });
            }
        }

        // --- Rendering Functions ---
        function renderLive() {
            const container = document.getElementById('live-content');
            const liveMatch = matches.find(m => m.status === 'live');

            if (liveMatch) {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex items-center gap-3 bg-red-500/10 border border-red-500/20 w-fit px-4 py-2 rounded-full">
                            <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>
                            <h2 class="text-sm font-bold text-red-400 uppercase tracking-widest">Live Broadcast</h2>
                        </div>
                        <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800">
                            <video id="live-video-player" controls class="w-full h-full object-contain" playsInline></video>
                        </div>
                        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 text-center shadow-xl">
                            <h2 class="text-4xl font-black mb-2">${liveMatch.teamHome} vs ${liveMatch.teamAway}</h2>
                            <p class="text-slate-400 text-lg">${liveMatch.title}</p>
                        </div>
                    </div>
                `;
                // Start video after DOM injects
                setTimeout(() => initPlayer('live-video-player', liveMatch.url), 100);
            } else {
                container.innerHTML = `
                    <div class="text-center py-32 bg-slate-900/50 rounded-2xl border border-slate-800 shadow-xl">
                        <div class="text-6xl mb-6">⚾️</div>
                        <h2 class="text-3xl font-black mb-3">No Live Matches</h2>
                        <p class="text-slate-400 text-lg">Check the archive for past games.</p>
                    </div>
                `;
            }
        }

        function renderArchive() {
            const container = document.getElementById('archive-grid');
            const archived = matches.filter(m => m.status === 'archived');

            if (archived.length === 0) {
                container.innerHTML = `<p class="text-slate-500 col-span-full">No archived games available yet.</p>`;
                return;
            }

            container.innerHTML = archived.map(match => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 hover:border-blue-500 hover:shadow-lg transition-all group">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="font-bold text-xl leading-tight">${match.teamHome} <br><span class="text-sm text-slate-500">vs</span><br> ${match.teamAway}</h3>
                    </div>
                    <p class="text-slate-400 text-sm mb-6">${match.title} • ${match.date}</p>
                    <button onclick="playArchived('${match.id}')" class="w-full bg-blue-600/20 text-blue-400 font-bold hover:bg-blue-600 hover:text-white py-3 rounded-xl transition-all flex justify-center items-center gap-2">
                        ▶ Watch Replay
                    </button>
                </div>
            `).join('');
        }

        function renderAdmin() {
            const container = document.getElementById('admin-list');
            
            container.innerHTML = matches.map(m => `
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 p-5 bg-slate-900 rounded-xl border border-slate-800 hover:border-slate-600 transition-colors">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] px-2 py-1 rounded font-bold uppercase tracking-wider ${m.status === 'live' ? 'bg-red-500/20 text-red-400' : 'bg-slate-800 text-slate-400'}">${m.status}</span>
                            <span class="text-sm font-bold">${m.teamHome} vs ${m.teamAway}</span>
                        </div>
                        <div class="text-xs text-slate-500 font-mono truncate max-w-sm">${m.url}</div>
                    </div>
                    <button onclick="deleteMatch('${m.id}')" class="px-4 py-2 bg-slate-950 border border-slate-800 hover:border-red-500 text-red-400 hover:bg-red-500/10 text-sm font-bold rounded-lg transition-all">Delete</button>
                </div>
            `).join('');
        }

        // --- Actions ---
        function handleSaveMatch(e) {
            e.preventDefault();
            
            const newMatch = {
                id: Date.now().toString(),
                title: document.getElementById('form-title').value,
                teamHome: document.getElementById('form-home').value,
                teamAway: document.getElementById('form-away').value,
                date: document.getElementById('form-date').value,
                status: document.getElementById('form-status').value,
                url: document.getElementById('form-url').value,
            };

            // If new is live, archive existing lives
            if (newMatch.status === 'live') {
                matches = matches.map(m => m.status === 'live' ? { ...m, status: 'archived' } : m);
            }

            matches.unshift(newMatch); // Add to beginning
            saveDb();
            
            // Clear inputs
            document.getElementById('form-title').value = '';
            document.getElementById('form-home').value = '';
            document.getElementById('form-away').value = '';
            
            // Update UI
            renderLive();
            renderArchive();
            renderAdmin();
            alert("Match saved to database!");
        }

        function deleteMatch(id) {
            if(confirm("Permanently delete this match?")) {
                matches = matches.filter(m => m.id !== id);
                saveDb();
                renderLive();
                renderArchive();
                renderAdmin();
            }
        }

        function playArchived(id) {
            // Force this match to be live so it plays in the main viewer
            matches = matches.map(m => {
                if(m.id === id) return { ...m, status: 'live' };
                if(m.status === 'live') return { ...m, status: 'archived' };
                return m;
            });
            saveDb();
            renderArchive();
            renderAdmin();
            switchTab('live');
        }

        // Start the App
        window.onload = initApp;
    </script>
</body>
</html>
